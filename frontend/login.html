<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CYBERGUARD</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            CYBERGUARD
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your CYBERGUARD account
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>


            <p class="auth-bottom">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <footer>

        <p>
            © 2026 CYBERGUARD | AI Cyber Defence Platform
        </p>

    </footer>
<script src="js/auth.js"></script>
</body>
</html>
